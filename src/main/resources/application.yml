spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: banco-java

  datasource:
    url: jdbc:mysql://localhost:3307/banco_java
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080