services:
  mysql:
    image: mysql:8.4
    container_name: banco-java-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: banco_java
    ports:
      - "3307:3306"
    volumes:
      - banco_java_data:/var/lib/mysql

volumes:
  banco_java_data: